<p-toast />
<p-confirmdialog />

<div class="p-4">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-x1 font-semibold">Materiales</h2>
        <p-button label="Nuevo Material" icon="pi pi-plus" (onClick)="createMaterial()"
            [style]="{ 'background-color': '#16a34a', 'border-color': '#16a34a', 'color': '#ffffff' }" />
    </div>

    <p-table [value]="materials()" [loading]="loading()" [paginator]="true" [rows]="5"
        [rowsPerPageOptions]="[5, 10, 20]" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header">
            <tr style="--p-datatable-header-cell-background:#16a34a; --p-datatable-header-cell-color:#ffffff;">
                <th>Id</th>
                <th>Material</th>
                <th>Unidad</th>
                <th>Categoria</th>
                <th>Stock Actual</th>
                <th>Stock Minimo</th>
                <th>Alerta</th>
                <th style="width: 120px">Acciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-material>
            <tr>
                <td>{{material.id}}</td>
                <td>{{material.name}}</td>
                <td>{{material.unidadMedida}}</td>
                <td>{{material.categoria}}</td>
                <td>{{material.stockActual}}</td>
                <td>{{material.stockMinimo}}</td>
                <td>@if (material.stockActual
                    < material.stockMinimo) { <p-tag value="Bajo" severity="danger" />
                    }
                <td>
                    <div class="flex gap-2">
                        <p-button icon="pi pi-pencil" severity="info" [text]="true"
                            (onClick)="editMaterial(material)" />
                        <p-button icon="pi pi-trash" severity="danger" [text]="true"
                            (onClick)="confirmDelete(material)" />
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
@if (showForm) {
<app-material-form [material]="selectedMaterial" (closed)="onFormClosed($event)" />
}
