<header class="sticky top-0 z-50 bg-white shadow-sm">
  <div class="mx-auto flex h-20 max-w-7xl items-center gap-4 px-4 sm:px-6 lg:px-8">

    <a routerLink="/home" class="block shrink-0" (click)="cerrarMenu()">
      <span class="sr-only">Inicio</span>
      <img src="assets/images/logos.png" alt="logo" class="h-12 w-auto object-contain sm:h-16">
    </a>

    <nav aria-label="Global" class="hidden min-w-0 flex-1 xl:block">
      <ul class="flex items-center gap-6 text-sm">
        @for (e of enlaces; track e.ruta) {
        <li>
          <a [routerLink]="e.ruta"
            class="flex items-center gap-1.5 whitespace-nowrap text-black transition hover:text-green-800">
            <i class="pi {{ e.icono }}"></i> {{ e.label }}
          </a>
        </li>
        }
      </ul>
    </nav>

    <div class="ml-auto flex shrink-0 items-center gap-2 sm:gap-3">
      @if (auth.isLoggedIn()) {
      <span
        class="inline-flex items-center gap-2 rounded-md bg-green-100 px-3 py-2 text-sm font-medium text-green-600 sm:px-5 sm:py-2.5">
        <i class="pi pi-user"></i>
        <span class="hidden max-w-[10rem] truncate font-semibold sm:inline">{{ auth.username() }}</span>
      </span>
      <button type="button" (click)="logout()"
        class="hidden items-center gap-2 rounded-md bg-purple-100 px-5 py-2.5 text-sm font-medium text-purple-700 transition hover:bg-purple-200 xl:flex">
        <i class="pi pi-sign-out"></i> Salir
      </button>
      } @else {
      <a routerLink="/login"
        class="rounded-md bg-green-500 px-4 py-2 text-sm font-medium text-black transition hover:bg-green-600 sm:px-5 sm:py-2.5">
        <i class="pi pi-lock"></i> Login
      </a>
      <a href="#"
        class="hidden rounded-md bg-purple-100 px-5 py-2.5 text-sm font-medium text-purple-700 transition hover:bg-purple-200 md:block">
        <i class="pi pi-user-plus"></i> Register
      </a>
      }
      <button type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuAbierto()" aria-label="Abrir o cerrar menú"
        class="rounded-md bg-gray-100 p-2.5 text-gray-600 transition hover:text-gray-600/75 xl:hidden">
        @if (menuAbierto()) {
        <i class="pi pi-times"></i>
        } @else {
        <i class="pi pi-bars"></i>
        }
      </button>
    </div>
  </div>

  @if (menuAbierto()) {
  <nav class="border-t border-gray-200 bg-white xl:hidden">
    <ul class="mx-auto flex max-w-7xl flex-col px-4 py-2 sm:px-6">
      @for (e of enlaces; track e.ruta) {
      <li>
        <a [routerLink]="e.ruta" (click)="cerrarMenu()"
          class="flex items-center gap-3 rounded-md px-2 py-3 text-black transition hover:bg-green-50 hover:text-green-800">
          <i class="pi {{ e.icono }}"></i> {{ e.label }}
        </a>
      </li>
      }
      @if (auth.isLoggedIn()) {
      <li class="mt-1 border-t border-gray-100 pt-1">
        <button type="button" (click)="logout()"
          class="flex w-full items-center gap-3 rounded-md px-2 py-3 text-left text-purple-700 transition hover:bg-purple-50">
          <i class="pi pi-sign-out"></i> Salir
        </button>
      </li>
      }
    </ul>
  </nav>
  }
</header>
