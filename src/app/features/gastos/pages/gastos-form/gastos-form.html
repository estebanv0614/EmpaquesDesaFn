<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '500px' }" header="Nuevo gasto"
    (onHide)="close(false)">
    <form [formGroup]="form" class="flex flex-col gap-4 mt-1">

        <p-floatlabel variant="on">
            <p-select formControlName="tipoGasto" [options]="tiposGasto()" optionLabel="name" styleClass="w-full"
                appendTo="body" />
            <label>Tipo de gasto *</label>
        </p-floatlabel>

        @if (esCompraMaterial) {
        <div class="grid grid-cols-2 gap-4">
            <p-floatlabel variant="on">
                <p-select formControlName="material" [options]="materiales()" optionLabel="name" styleClass="w-full"
                    appendTo="body" />
                <label>Material *</label>
            </p-floatlabel>
            <p-floatlabel variant="on">
                <input pInputText type="number" formControlName="cantidad" class="w-full" />
                <label>Cantidad *</label>
            </p-floatlabel>
        </div>
        }

        <div class="grid grid-cols-2 gap-4">
            <p-floatlabel variant="on">
                <input pInputText type="number" formControlName="monto" class="w-full" />
                <label>Monto *</label>
            </p-floatlabel>
            <p-floatlabel variant="on">
                <p-datepicker formControlName="fechaGasto" dateFormat="dd/mm/yy" [showIcon]="true" appendTo="body"
                    styleClass="w-full" />
                <label>Fecha *</label>
            </p-floatlabel>
        </div>

        <p-floatlabel variant="on">
            <textarea pInputTextarea formControlName="descripcion" rows="2" class="w-full"></textarea>
            <label>Descripción *</label>
        </p-floatlabel>

        <div class="grid grid-cols-2 gap-4">
            <p-floatlabel variant="on">
                <p-select formControlName="metodoPago" [options]="metodosPago()" optionLabel="name" styleClass="w-full"
                    appendTo="body" />
                <label>Método de pago *</label>
            </p-floatlabel>
            <p-floatlabel variant="on">
                <p-select formControlName="empleado" [options]="responsable()" optionLabel="position"
                    styleClass="w-full" appendTo="body" />
                <label>Responsable *</label>
            </p-floatlabel>
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-sm text-gray-600">Comprobante (opcional)</label>

            <input #fileInput type="file" hidden accept="image/png,image/jpeg,image/webp"
                (change)="onFileSelected($event)" />

            @if (previewUrl) {
            <div class="relative rounded-lg border border-gray-200 p-2">
                <img [src]="previewUrl" alt="Vista previa del comprobante"
                    class="h-40 w-full rounded-md object-contain" />
                <button type="button" (click)="quitarImagen()" aria-label="Quitar imagen"
                    class="absolute right-2 top-2 flex h-7 w-7 items-center justify-center rounded-full bg-white/90 shadow hover:bg-white">
                    <i class="pi pi-times text-xs"></i>
                </button>
                @if (archivoSeleccionado) {
                <p class="mt-1 truncate text-xs text-gray-500">{{ archivoSeleccionado.name }}</p>
                }
            </div>
            } @else {
            <div role="button" tabindex="0" (click)="fileInput.click()" (keydown.enter)="fileInput.click()"
                (keydown.space)="fileInput.click(); $event.preventDefault()" (dragover)="onDragOver($event)"
                (dragleave)="arrastrando.set(false)" (drop)="onDrop($event)"
                class="flex cursor-pointer flex-col items-center justify-center gap-1 rounded-lg border-2 border-dashed px-4 py-6 text-center transition-colors"
                [class.border-blue-500]="arrastrando()" [class.bg-blue-50]="arrastrando()"
                [class.border-gray-300]="!arrastrando()">
                <i class="pi pi-cloud-upload text-2xl text-gray-400"></i>
                <span class="text-sm text-gray-600">Arrastra una imagen o haz clic para seleccionarla</span>
                <span class="text-xs text-gray-400">JPG, PNG o WEBP · máx. 5 MB</span>
            </div>
            }

            @if (errorImagen()) {
            <small class="text-red-500">{{ errorImagen() }}</small>
            }
        </div>
    </form>

    <ng-template pTemplate="footer">
        <div class="flex justify-center gap-3 w-full">
            <p-button label="Cancelar" severity="secondary" (onClick)="close(false)" />
            <p-button label="Guardar" (onClick)="onSave()" [loading]="enviando()" />
        </div>
    </ng-template>
</p-dialog>
