<p-toast />
<p-confirmdialog />

<div class="p-4">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-semibold">Personas</h2>
    <p-button label="Nueva persona" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>

  <p-table [value]="persons()" [loading]="loading()" [paginator]="true" [rows]="5" [rowsPerPageOptions]="[5, 10, 20]"
    [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Documento</th>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Email</th>
        <th>Dirección</th>
        <th style="width: 120px">Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-person>
      <tr>
        <td>{{ person.tipoDocumento?.name }} - {{ person.documentNumber }}</td>
        <td>{{ person.name }}</td>
        <td>{{ person.phone }}</td>
        <td>{{ person.email }}</td>
        <td>{{ person.address }}</td>
        <td>
          <div class="flex gap-2">
            <p-button icon="pi pi-pencil" severity="info" [text]="true" (onClick)="openEdit(person)" />
            <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="confirmDelete(person)" />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="text-center py-4">No hay personas registradas</td>
      </tr>
    </ng-template>
  </p-table>
</div>

@if (showForm) {
<app-person-from [person]="selectedPerson" (closed)="onFormClosed($event)" />
}


<div class="space-y-2">
  <details class="group [&_summary::-webkit-details-marker]:hidden">
    <summary
      class="flex cursor-pointer items-center justify-between gap-4 rounded-lg border border-gray-200 bg-white px-4 py-3 font-medium text-gray-900 hover:bg-gray-50">
      <span>Lista Empleados.</span>

      <svg aria-hidden="true" class="size-5 shrink-0 transition-transform duration-300 group-open:-rotate-180"
        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </summary>

    <div class="mt-8 mb-6">
      <app-empleado-list></app-empleado-list>
    </div>
  </details>
</div>
