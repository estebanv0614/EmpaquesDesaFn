<div class="p-4">
  <h2 class="text-xl font-semibold mb-4">Estadísticas de pedidos</h2>

  @if (resumen(); as r) {
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded-lg p-4 shadow-sm">
      <div class="text-sm text-gray-500">Hoy</div>
      <div class="text-2xl font-semibold mt-1">{{ r.hoy }}</div>
    </div>
    <div class="bg-white rounded-lg p-4 shadow-sm">
      <div class="text-sm text-gray-500">Esta semana</div>
      <div class="text-2xl font-semibold mt-1">{{ r.estaSemana }}</div>
    </div>
    <div class="bg-white rounded-lg p-4 shadow-sm">
      <div class="text-sm text-gray-500">Este mes</div>
      <div class="text-2xl font-semibold mt-1">{{ r.esteMes }}</div>
    </div>
    <div class="bg-white rounded-lg p-4 shadow-sm">
      <div class="text-sm text-gray-500">Este año</div>
      <div class="text-2xl font-semibold mt-1">{{ r.esteAnio }}</div>
    </div>
  </div>
  }

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="bg-white rounded-lg p-4 shadow-sm">
      <div class="font-medium mb-3">Pedidos por mes</div>
      <p-chart type="line" [data]="chartDataMes()" [options]="chartOptions" [height]="'250px'" />
    </div>

    <div class="bg-white rounded-lg p-4 shadow-sm">
      <div class="font-medium mb-3">Pedidos por día</div>
      <p-chart type="bar" [data]="chartDataDia()" [options]="chartOptions" [height]="'250px'" />
    </div>
  </div>
</div>
