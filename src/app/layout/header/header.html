<header class="sticky top-0 z-50 bg-white shadow-md">
  <div class="mx-auto flex h-16 max-w-7xl items-center gap-8 px-4 sm:px-6 lg:px-8">
    <a class="block text-teal-600" href="#">
      <span class="sr-only">Home</span>
      <img src="assets/images/logos.png" alt="logo" class="h-16 w-auto object-contain">
    </a>

    <div class="flex flex-1 items-center justify-end md:justify-between">
      <nav aria-label="Global" class="hidden md:block">
        <ul class="flex items-center gap-6 text-sm">
          <li>
            <a class="text-black transition hover:text-green-800" href="#"><i class="pi pi-home"></i> Inicio</a>
          </li>
          <li>
            <a routerLink="/solicitudes-cotizacion" class="text-black transition hover:text-green-800"><i class="pi pi-phone"></i> Solicitudes</a>
          </li>
          <li>
            <a routerLink="/persons" class="text-black transition hover:text-green-800"> About </a>
          </li>
          <li>
            <a class="text-gray-500 transition hover:text-gray-500/75" href="#"> History </a>
          </li>

          <li>
            <a class="text-gray-500 transition hover:text-gray-500/75" href="#"> Services </a>
          </li>

          <li>
            <a class="text-gray-500 transition hover:text-gray-500/75" href="#"> Projects </a>
          </li>

          <li>
            <a class="text-gray-500 transition hover:text-gray-500/75" href="#"> Blog </a>
          </li>
        </ul>
      </nav>

      <div class="flex items-center gap-4">
        <div class="flex items-center gap-4">
          @if (auth.isLoggedIn()) {
          <div class="flex items-center gap-3">
            <span class="rounded-md bg-green-500 px-5 py-2.5 text-sm font-medium text-white">
              Bienvenido, <span class="font-semibold">{{ auth.username() }}</span>
            </span>
            <button (click)="logout()"
              class="hidden rounded-md bg-purple-100 px-5 py-2.5 text-sm font-medium text-purple-700 transition hover:bg-purple-200 sm:block">
              Cerrar sesión
            </button>
          </div>
          } @else {
          <div class="sm:flex sm:gap-4">
            <a routerLink="login"
              class="block rounded-md bg-green-500 px-5 py-2.5 text-sm font-medium text-black-100 transition hover:bg-green-600">Login</a>
            <a class="hidden rounded-md bg-purple-100 px-5 py-2.5 text-sm font-medium text-purple-700 transition hover:bg-purple-200 sm:block"
              href="#">Register</a>
          </div>
          }

          <button class="block rounded-sm bg-gray-100 p-2.5 text-gray-600 transition hover:text-gray-600/75 md:hidden">
            <span class="sr-only">Toggle menu</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
              stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
        </div>


        <button class="block rounded-sm bg-gray-100 p-2.5 text-gray-600 transition hover:text-gray-600/75 md:hidden">
          <span class="sr-only">Toggle menu</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
</header>
