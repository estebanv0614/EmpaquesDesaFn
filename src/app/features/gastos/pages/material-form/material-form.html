<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '450px' }"
    [header]="isEditMode ? 'Editar material' : 'Nuevo material'" (onHide)="closeDialog(false)">
    <form [formGroup]="form" (ngSubmit)="onSave()" class="grid grid-cols-1 sm:grid-cols-2 gap-3 p-3">

        <div class="flex flex-col gap-1">
            <p-floatlabel variant="on">
                <input pInputText type="text" autocomplete="off" id="name" formControlName="name" class="w-full" />
                <label for="name">Material</label>
            </p-floatlabel>
        </div>

        <div class="flex flex-col gap-1">
            <p-floatlabel variant="on">
                <input pInputText type="number" autocomplete="off" id="unidadMedida" formControlName="unidadMedida"
                    class="w-full" />
                <label for="unidadMedida">Unidad (kg, gr, mt)</label>
            </p-floatlabel>
        </div>

        <div class="flex flex-col gap-1">
            <p-floatlabel variant="on">
                <input pInputText type="name" autocomplete="off" id="categoria" formControlName="categoria"
                    class="w-full" />
                <label for="categoria">Categoría</label>
            </p-floatlabel>
        </div>

        <div class="flex flex-col gap-1">
            <p-floatlabel variant="on">
                <input pInputText type="number" autocomplete="off" id="stockMinimo" formControlName="stockMinimo"
                    class="w-full" />
                <label for="stockMinimo">Stock Minimo</label>
            </p-floatlabel>
        </div>

    </form>
    <ng-template pTemplate="footer">
        <div class="flex justify-center gap-3 w-full">
            <p-button label="Cancelar" severity="secondary" (onClick)="closeDialog(false)" />
            <p-button label="Guardar" (onClick)="onSave()" />
        </div>
    </ng-template>
</p-dialog>
