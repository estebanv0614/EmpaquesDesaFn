<div class="p-3 flex flex-wrap items-center justify-end gap-6">
    <p-button label="Exportar semana" icon="pi pi-file-excel" severity="contrast" [text]="true"
        (onClick)="exportar('semana')" [loading]="exportando()" />

    <!-- Mes -->
    <div class="flex items-center gap-2">
        <p-button icon="pi pi-chevron-left" [text]="true" (onClick)="mesAnterior()" aria-label="Mes anterior" />
        <p-button [label]="'Exportar ' + etiquetaMes()" icon="pi pi-file-excel" severity="contrast" [text]="true"
            (onClick)="exportar('mes')" [loading]="exportando()" />
        <p-button icon="pi pi-chevron-right" [text]="true" [disabled]="esMesActual()" (onClick)="mesSiguiente()"
            aria-label="Mes siguiente" />
    </div>

    <!-- Año -->
    <div class="flex items-center gap-2">
        <p-button icon="pi pi-chevron-left" [text]="true" (onClick)="anioAnterior()" aria-label="Año anterior" />
        <p-button [label]="'Exportar año ' + anio()" icon="pi pi-file-excel" severity="contrast" [text]="true"
            (onClick)="exportar('anio')" [loading]="exportando()" />
        <p-button icon="pi pi-chevron-right" [text]="true" [disabled]="esAnioActual()" (onClick)="anioSiguiente()"
            aria-label="Año siguiente" />
    </div>
</div>
