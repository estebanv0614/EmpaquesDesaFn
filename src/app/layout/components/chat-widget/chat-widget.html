@if (chat.isOpen()) {
  <section
    class="fixed right-5 bottom-28 z-9999 isolate flex h-150 max-h-[calc(100vh-9rem)] w-95 max-w-[calc(100vw-2rem)] flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-2xl"
    role="dialog"
    aria-label="Asistente Empaques Desa">

    <header class="flex shrink-0 items-center gap-3 bg-linear-to-br from-purple-700 to-purple-500 px-4 py-3.5 text-white">
      <p-avatar icon="pi pi-comments" shape="circle" size="large" styleClass="bg-white/20! text-white!" />

      <div class="flex flex-1 flex-col leading-tight">
        <strong class="text-base">Asistente Empaques Desa</strong>
        <span class="flex items-center gap-1.5 text-xs opacity-90">
          <i class="inline-block size-2 rounded-full bg-green-400"></i> En línea
        </span>
      </div>

      <p-button
        icon="pi pi-times"
        [rounded]="true"
        [text]="true"
        size="small"
        styleClass="text-white! hover:bg-white/25!"
        ariaLabel="Cerrar chat"
        (onClick)="close()" />
    </header>

    <div #body class="flex flex-1 flex-col gap-4 overflow-y-auto bg-white px-4 py-5">
      @for (msg of messages(); track $index) {
        <div
          class="flex max-w-[88%] flex-col"
          [class]="msg.from === 'user' ? 'items-end self-end' : 'items-start self-start'">

          <div
            class="rounded-2xl px-3.5 py-2.5 text-sm leading-relaxed wrap-break-word"
            [class]="msg.from === 'user'
              ? 'rounded-br-sm bg-purple-700 text-white'
              : 'rounded-bl-sm bg-gray-100 text-gray-800'">

            <p class="m-0 whitespace-pre-line">{{ msg.text }}</p>

            @if (msg.links?.length) {
              <div class="mt-3 flex flex-col gap-2">
                @for (l of msg.links; track l.url) {
                  <p-button
                    [label]="l.label"
                    [icon]="l.icon"
                    [outlined]="true"
                    severity="help"
                    size="small"
                    styleClass="w-full bg-white!"
                    (onClick)="openLink(l.url)" />
                }
              </div>
            }
          </div>

          <span class="mt-1 px-1 text-[0.7rem] text-gray-400">{{ msg.time }}</span>
        </div>
      }

      @if (typing()) {
        <div class="flex w-fit items-center gap-1.5 self-start rounded-2xl rounded-bl-sm bg-gray-100 px-4 py-3.5">
          <span class="size-2 animate-bounce rounded-full bg-purple-300"></span>
          <span class="size-2 animate-bounce rounded-full bg-purple-300 [animation-delay:150ms]"></span>
          <span class="size-2 animate-bounce rounded-full bg-purple-300 [animation-delay:300ms]"></span>
        </div>
      }
    </div>

    <p-divider styleClass="my-0!" />

    <footer class="max-h-44 shrink-0 overflow-y-auto bg-white px-3.5 pt-3 pb-3.5">
      <p class="mb-2 text-[0.7rem] font-bold tracking-wider text-gray-500 uppercase">Preguntas rápidas</p>
      <div class="flex flex-wrap gap-2">
        @for (q of quickQuestions; track q.question) {
          <p-button
            [label]="q.question"
            [outlined]="true"
            [rounded]="true"
            [disabled]="typing()"
            severity="help"
            size="small"
            styleClass="bg-white!"
            (onClick)="selectQuestion(q)" />
        }
      </div>
    </footer>
  </section>
}
