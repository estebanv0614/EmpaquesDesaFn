<div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
  @if (cargando()) {
    <p class="text-center text-gray-500">Cargando catálogo...</p>
  } @else if (productos().length === 0) {
    <p class="text-center text-gray-500">No hay productos disponibles.</p>
  } @else {
    <div class="grid grid-cols-1 gap-8 md:grid-cols-3">
      <div *ngFor="let item of productos()"
           (click)="irASolicitarCotizacion()"
           class="block rounded-lg p-4 shadow-xs bg-white sm:p-6 cursor-pointer hover:shadow-md transition-shadow">
        <div class="w-full aspect-[1085/1450] overflow-hidden rounded-lg bg-white flex items-center justify-center">
          <img [src]="getImagen(item)" [alt]="item.name" class="max-w-full max-h-full object-contain">
        </div>
        <div class="mt-2">
          <dl>
            <div>
              <dt class="sr-only">Precio</dt>
              <dd class="text-sm text-gray-500">{{ item.precioBase | currency:'COP':'symbol-narrow':'1.0-0' }}</dd>
            </div>
            <div>
              <dt class="sr-only">Nombre</dt>
              <dd class="font-medium">{{ item.name }}</dd>
            </div>
          </dl>
          <div class="mt-4 text-xs text-gray-500">
            <p *ngIf="item.anchoCm && item.largoCm">
              {{ item.anchoCm }} x {{ item.largoCm }} cm — Calibre {{ item.calibre }}
            </p>
          </div>
        </div>
      </div>
    </div>
  }
</div>
