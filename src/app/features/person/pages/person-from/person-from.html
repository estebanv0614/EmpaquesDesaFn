<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '450px' }"
    [header]="isEditMode ? 'Editar persona' : 'Nueva persona'" (onHide)="closeDialog(false)">
    <form [formGroup]="form" (ngSubmit)="onSave()" class="grid grid-cols-1 sm:grid-cols-2 gap-3 p-3">

        <div class="flex flex-col gap-1">
            <p-floatlabel variant="on">
                <p-select formControlName="tipoDocumento" [options]="tipoDocumentoPersona()" optionLabel="name"
                    inputId="tipoDocumento" styleClass="w-full" appendTo="body" />
                <label>Tipo de documento</label>
            </p-floatlabel>
        </div>

        <div class="flex flex-col gap-1">
            <p-floatlabel variant="on">
                <input pInputText autocomplete="off" id="documentNumber" formControlName="documentNumber"
                    class="w-full" />
                <label for="documentNumber">Número de documento</label>
            </p-floatlabel>
        </div>

        <div class="flex flex-col gap-1">
            <p-floatlabel variant="on">
                <input pInputText autocomplete="off" id="name" formControlName="name" class="w-full" />
                <label for="name">Nombre</label>
            </p-floatlabel>
        </div>

        <div class="flex flex-col gap-1">
            <p-floatlabel variant="on">
                <input pInputText autocomplete="off" id="phone" formControlName="phone" class="w-full" />
                <label for="phone">Teléfono</label>
            </p-floatlabel>
        </div>

        <div class="flex flex-col gap-1">
            <p-floatlabel variant="on">
                <input pInputText autocomplete="off" id="email" formControlName="email" class="w-full" />
                <label for="email">Email</label>
            </p-floatlabel>
        </div>

        <div class="flex flex-col gap-1">
            <p-floatlabel variant="on">
                <input pInputText autocomplete="off" id="address" formControlName="address" class="w-full" />
                <label for="address">Dirección</label>
            </p-floatlabel>
        </div>
        @if (tieneCliente) {
        <div class="col-span-1 sm:col-span-2 mt-3">
            <h3 class="text-lg font-semibold border-b pb-2">
                Datos comerciales del cliente
            </h3>
        </div>
        <div class="flex flex-col gap-1">
            <p-floatlabel variant="on">
                <input pInputText formControlName="empresa" class="w-full" />
                <label>Empresa</label>
            </p-floatlabel>
        </div>

        <div class="flex flex-col gap-1">
            <p-floatlabel variant="on">
                <p-select formControlName="tipoCliente" [options]="tipoCliente" optionLabel="label" optionValue="value"
                    inputId="tipoCliente" styleClass="w-full" appendTo="body" />
                <label for="tipoCliente">Tipo de cliente</label>
            </p-floatlabel>
        </div>

        <div class="flex flex-col gap-1">
            <p-floatlabel variant="on">
                <input pInputText formControlName="direccionEntrega" id="direccionEntrega" class="w-full" />
                <label for="direccionEntrega">Dirección de entrega</label>
            </p-floatlabel>
        </div>

        <div class="flex flex-col gap-1">
            <p-floatlabel variant="on">
                <input pInputText formControlName="ciudad" id="ciudad" class="w-full">
                <label for="ciudad">Ciudad</label>
            </p-floatlabel>
        </div>
        }
    </form>

    <ng-template pTemplate="footer">
        <div class="flex justify-center gap-3 w-full">
            <p-button label="Cancelar" severity="secondary" (onClick)="closeDialog(false)" />
            <p-button label="Guardar" (onClick)="onSave()" />
        </div>
    </ng-template>
</p-dialog>
